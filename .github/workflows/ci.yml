name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cobrix:ci .
      - name: Smoke test
        run: |
          docker run -d --name cobrix -p 4300:4300 -p 4310:4310 cobrix:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cobrix)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cobrix | grep -qx healthy
          curl -fsS http://127.0.0.1:4300/ | grep -q 'Resumen'
          curl -fsS http://127.0.0.1:4310/docs > /dev/null
      - if: failure()
        run: docker logs cobrix
